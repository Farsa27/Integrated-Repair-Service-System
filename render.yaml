services:
  - type: web
    name: repair-service-api
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: MONGODB_URI
        scope: build,runtime
      - key: JWT_SECRET
        scope: build,runtime
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        scope: build,runtime
      - key: GOOGLE_CLIENT_SECRET
        scope: build,runtime
      - key: FRONTEND_URL
        value: https://your-frontend-domain.onrender.com

  - type: web
    name: repair-service-frontend
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: REACT_APP_GOOGLE_CLIENT_ID
        scope: build,runtime
      - key: REACT_APP_API_URL
        value: https://your-api-domain.onrender.com
